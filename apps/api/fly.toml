# Fly.io apps — deploy API and Celery worker as two apps sharing the same image.
# Create secrets via: fly secrets set KEY=value -a <app>
#
# Suggested setup:
#   fly apps create housing-decision-api
#   fly apps create housing-decision-worker
#   fly deploy -a housing-decision-api --config apps/api/fly.toml
#   fly deploy -a housing-decision-worker --config apps/api/fly.worker.toml

app = 'housing-decision-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'production'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
