repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        files: ^apps/api/src/
        args: ["--config-file", "apps/api/pyproject.toml"]
        additional_dependencies:
          - pydantic-settings
          - structlog
          - types-redis
